<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Morse · OmniNeti</title>

  <!-- PWA Meta Tags & iOS Support -->
  <meta name="theme-color" content="#2d2d44">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Morse Pro">
  <meta name="description" content="Codificador y Decodificador de Código Morse en vivo OmniNeti Pro">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f3f0;
      color: #1e1e2a;
      padding: 1rem;
    }

    body.dark {
      background: #1a1a24;
      color: #e8e6e1;
    }
    body.dark .card {
      background: #2a2a36;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    body.dark input, body.dark textarea {
      background: #2f2f3d;
      color: #eee;
      border-color: #4a4a5a;
    }
    body.dark .btn-outline {
      border-color: #7a7a8a;
      color: #ddd;
    }
    body.dark .btn-outline:hover {
      background: #3a3a4a;
    }
    body.dark .morse-char {
      background: #333344;
    }
    body.dark .manual-letter {
      background: #2a2a3a;
      border-color: #4a4a5a;
    }
    body.dark .manual-letter .highlight-dot {
      color: #7dffb3;
    }
    body.dark .manual-letter .highlight-dash {
      color: #ffb37d;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }
    .top-bar h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .top-bar h1 small {
      font-weight: 300;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .card {
      background: #ffffffcc;
      backdrop-filter: blur(2px);
      background: #fff;
      border-radius: 28px;
      padding: 1.2rem 1.5rem;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .morse-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 6px;
      margin: 0.2rem 0 0.4rem;
    }
    .morse-char {
      background: #f0ede8;
      border-radius: 18px;
      padding: 6px 0;
      text-align: center;
      font-weight: 500;
      font-size: 1.1rem;
      transition: 0.1s;
    }
    .morse-char .code {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      opacity: 0.75;
      font-family: 'Courier New', monospace;
    }
    body.dark .morse-char {
      background: #333344;
    }

    .message-area {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .message-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }
    .message-row textarea {
      flex: 1 1 220px;
      padding: 0.8rem 1rem;
      border-radius: 40px;
      border: 1px solid #ccc;
      font-size: 1rem;
      resize: vertical;
      min-height: 54px;
      font-family: inherit;
      background: #fafafa;
      transition: 0.15s;
    }
    .message-row textarea:focus {
      outline: 2px solid #7d7dff;
      border-color: transparent;
    }

    .btn {
      background: #2d2d44;
      border: none;
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: 0.15s;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn:hover {
      transform: scale(0.96);
      filter: brightness(1.1);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #2d2d44;
      color: #2d2d44;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #eaeaf0;
    }
    .btn-danger {
      background: #b13e3e;
      color: white;
    }
    .btn-success {
      background: #1f7a4a;
    }
    .btn-warning {
      background: #b17d3a;
    }
    .btn-install {
      background: #4a4ae6;
      color: white;
      display: none;
    }
    .btn-sm {
      padding: 0.35rem 0.9rem;
      font-size: 0.8rem;
    }
    .btn-lg {
      padding: 0.6rem 1.8rem;
      font-size: 1.1rem;
    }

    .flex-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }

    .status-badge {
      font-size: 0.85rem;
      opacity: 0.7;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      background: #ddd;
    }
    body.dark .status-badge {
      background: #3a3a4a;
    }

    .manual-panel {
      display: none;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.4rem;
      padding: 0.8rem;
      background: #f0ede8;
      border-radius: 20px;
    }
    body.dark .manual-panel {
      background: #2a2a3a;
    }

    .manual-writing-area {
      background: #fff;
      border-radius: 16px;
      padding: 0.8rem 1rem;
      border: 2px dashed #ccc;
      min-height: 50px;
      font-size: 1.2rem;
      font-family: 'Courier New', monospace;
      word-break: break-word;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
    }
    body.dark .manual-writing-area {
      background: #2a2a3a;
      border-color: #4a4a5a;
    }
    .manual-writing-area .char-display {
      display: inline-block;
      padding: 0.1rem 0.2rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .manual-writing-area .char-display.done {
      color: #1f7a4a;
    }
    .manual-writing-area .char-display.current {
      background: #e8e8ff;
      color: #2d2d44;
      border-bottom: 3px solid #7d7dff;
      animation: blink 1s infinite;
    }
    .manual-writing-area .char-display.pending {
      color: #999;
      opacity: 0.5;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    body.dark .manual-writing-area .char-display.current {
      background: #2a2a5a;
      color: #e8e6e1;
    }

    .morse-current-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 16px;
      padding: 0.6rem 1rem;
      border: 3px solid #7d7dff;
      min-width: 80px;
      min-height: 70px;
    }
    body.dark .morse-current-box {
      background: #2a2a3a;
      border-color: #7d7dff;
    }
    .morse-current-box .letter-display {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      min-height: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .morse-current-box .code-display {
      font-size: 1.1rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 3px;
      opacity: 0.8;
      min-height: 1.5rem;
    }
    .morse-current-box .code-display .highlight-dot {
      color: #b17d3a;
      font-weight: bold;
    }
    .morse-current-box .code-display .highlight-dash {
      color: #b17d3a;
      font-weight: bold;
    }
    .morse-current-box .code-display .highlight-dim {
      opacity: 0.9;
    }
    .morse-current-box .empty-hint {
      font-size: 0.7rem;
      opacity: 0.99;
    }

    .manual-message-display {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem;
      justify-content: center;
      max-height: 200px;
      overflow-y: auto;
    }

    .manual-letter {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.4rem 0.6rem;
      background: #fff;
      border-radius: 12px;
      border: 2px solid #ddd;
      min-width: 50px;
      transition: all 0.3s;
    }
    body.dark .manual-letter {
      background: #2a2a3a;
      border-color: #4a4a5a;
    }
    .manual-letter .letter-char {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .manual-letter .letter-code {
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      opacity: 0.7;
    }
    .manual-letter .highlight-dot {
      color: #2d7d4a;
      font-weight: bold;
    }
    .manual-letter .highlight-dash {
      color: #b17d3a;
      font-weight: bold;
    }
    .manual-letter .highlight-dim {
      opacity: 0.3;
    }
    .manual-letter.current {
      border-color: #7d7dff;
      background: #e8e8ff;
      transform: scale(1.05);
    }
    body.dark .manual-letter.current {
      border-color: #7d7dff;
      background: #2a2a5a;
    }
    .manual-letter.done {
      border-color: #4a9a6a;
      opacity: 0.8;
    }

    .manual-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      justify-content: center;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
      border-top: 1px solid #ccc;
      padding-top: 1.2rem;
    }
    body.dark footer {
      border-top-color: #3a3a4a;
    }

    @media (max-width: 540px) {
      .top-bar h1 { font-size: 1.2rem; }
      .card { padding: 0.9rem 1rem; }
      .morse-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
      .btn { font-size: 0.8rem; padding: 0.5rem 0.9rem; }
      .manual-letter { min-width: 40px; padding: 0.3rem 0.4rem; }
      .manual-letter .letter-char { font-size: 1.1rem; }
      .morse-current-box { min-width: 60px; min-height: 60px; }
      .morse-current-box .letter-display { font-size: 1.6rem; }
      .manual-top-row { flex-direction: column; }
    }

    #fileInput { display: none; }

    .receiver-panel {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.8rem;
      padding: 0.9rem;
      border-radius: 22px;
      background: #f0ede8;
    }
    body.dark .receiver-panel { background: #252535; }

    .receiver-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .receiver-toolbar label {
      font-size: 0.8rem;
      opacity: 0.75;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .receiver-toolbar input[type="range"] {
      width: 105px;
      accent-color: #5555cc;
    }

    .signal-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
      align-items: center;
    }

    .signal-meter {
      height: 12px;
      border-radius: 20px;
      overflow: hidden;
      background: #d7d7dc;
      position: relative;
    }
    .signal-meter-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      transition: width 0.08s linear;
      background: #2d9b63;
    }
    .signal-text {
      min-width: 82px;
      text-align: right;
      font-size: 0.78rem;
      opacity: 0.75;
    }

    #waveformCanvas {
      width: 100%;
      height: 125px;
      display: block;
      border-radius: 16px;
      background: #101018;
      touch-action: none;
    }

    .decoder-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .decoder-stat {
      background: rgba(255,255,255,0.75);
      border-radius: 14px;
      padding: 0.55rem;
      text-align: center;
    }
    body.dark .decoder-stat { background: #303044; }
    .decoder-stat strong {
      display: block;
      font-size: 1rem;
    }
    .decoder-stat span {
      font-size: 0.7rem;
      opacity: 0.7;
    }

    .rx-message {
      min-height: 70px;
      padding: 0.8rem 1rem;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #ddd;
      font-family: 'Courier New', monospace;
      font-size: 1.15rem;
      line-height: 1.5;
      word-break: break-word;
    }
    body.dark .rx-message {
      background: #303044;
      border-color: #4a4a5a;
    }

    .rx-current {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      min-height: 1.5em;
      letter-spacing: 2px;
      text-align: center;
      font-weight: 700;
    }

    .receiver-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
      font-size: 0.8rem;
    }

    .receiver-options select {
      border: 1px solid #ccc;
      border-radius: 20px;
      padding: 0.35rem 0.6rem;
      background: #fff;
      color: inherit;
    }
    body.dark .receiver-options select {
      background: #303044;
      color: #eee;
      border-color: #4a4a5a;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      background: #999;
      margin-right: 4px;
    }
    .live-dot.active {
      background: #d44;
      box-shadow: 0 0 0 5px rgba(212,68,68,.15);
      animation: rxblink 1s infinite;
    }
    @keyframes rxblink {
      50% { opacity: .35; }
    }

    .color-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }
    .color-modal.show {
      display: flex;
    }
    .color-modal-content {
      background: #fff;
      padding: 1.5rem;
      border-radius: 24px;
      max-width: 420px;
      width: 90%;
    }
    body.dark .color-modal-content {
      background: #2a2a3a;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: 0.2s;
      min-height: 40px;
    }
    .color-swatch:hover {
      transform: scale(1.08);
      border-color: #7d7dff;
    }
    .color-swatch.selected {
      border-color: #2d2d44;
    }
    .modal-close {
      text-align: right;
    }
    .modal-close button {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .modal-close button:hover {
      opacity: 1;
    }

    .manual-top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: stretch;
    }
    .manual-top-row .manual-writing-area {
      flex: 1;
      min-width: 200px;
    }

    @media (max-width: 600px) {
      .receiver-panel { padding: 0.7rem; border-radius: 18px; }
      #waveformCanvas { height: 105px; }
      .decoder-grid { grid-template-columns: repeat(2, 1fr); }
      .receiver-toolbar .btn,
      .receiver-options .btn { flex: 1 1 auto; }
      .receiver-toolbar input[type="range"] { width: 90px; }
      .signal-row { grid-template-columns: 1fr; }
      .signal-text { text-align: left; }
      .rx-message { font-size: 1rem; min-height: 62px; }
      .color-grid { grid-template-columns: repeat(5, 1fr); }
      .manual-top-row { flex-direction: column; }
    }

    @media (max-width: 380px) {
      .decoder-grid { grid-template-columns: repeat(2, 1fr); }
      #waveformCanvas { height: 92px; }
      .color-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .audio-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .receive-status {
      font-size: 0.85rem;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      background: #e0e0e0;
    }
    body.dark .receive-status {
      background: #3a3a4a;
    }

    .manual-placeholder {
      color: #999;
      font-style: italic;
      font-weight: 300;
    }
    body.dark .manual-placeholder {
      color: #666;
    }

    .btn-auto-mode {
      background: #1f7a4a;
    }
    .btn-auto-mode:hover {
      background: #2a9d5a;
    }

    .security-badge {
      display: inline-block;
      background: #4a9a6a;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    body.dark .security-badge {
      background: #2a7a4a;
    }

    .decoded-msg-display {
      background: #e8f5e9;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      display: inline-block;
    }
    body.dark .decoded-msg-display {
      background: #1a3a2a;
    }
  </style>
</head>
<body>
<div class="app" id="app">

  <div class="top-bar">
    <h1>· Morse <small>OmniNeti</small></h1>
    <div class="controls">
      <button class="btn btn-install btn-sm" id="installBtn">📲 instalar App</button>
      <button class="btn btn-outline btn-sm" id="themeToggle">🌓 oscuro</button>
      <button class="btn btn-outline btn-sm" id="bgConfigBtn">🖌️ fondo</button>
      <button class="btn btn-outline btn-sm" id="fgConfigBtn">✏️ texto</button>
      <button class="btn btn-outline btn-sm" id="resetConfigBtn">🔄 resetear RX</button>
    </div>
  </div>

  <div class="card">
    <div class="morse-grid" id="morseGrid"></div>
  </div>

  <div class="card message-area">
    <div class="message-row">
      <textarea id="messageInput" placeholder="Escribe el mensaje a codificar en Morse..." rows="1"></textarea>
      <button class="btn btn-auto-mode" id="sendAutoBtn">📤 automático</button>
      <button class="btn btn-outline" id="sendManualBtn">📟 manual</button>
    </div>

    <div class="manual-panel" id="manualPanel">
      <div class="manual-top-row">
        <div class="manual-writing-area" id="manualWritingArea">
          <span class="manual-placeholder" id="writingPlaceholder">Escribe tu mensaje letra por letra...</span>
        </div>
        <div class="morse-current-box" id="morseCurrentBox">
          <div class="letter-display" id="morseLetterDisplay">_</div>
          <div class="code-display" id="morseCodeDisplay"><span class="empty-hint">· · ·</span></div>
        </div>
      </div>

      <div class="manual-message-display" id="manualMessageDisplay"></div>
      <div class="manual-controls">
        <button class="btn btn-sm" id="dotBtn">· punto</button>
        <button class="btn btn-sm" id="dashBtn">— raya</button>
        <button class="btn btn-sm btn-success" id="completeLetterBtn">✓ letra</button>
        <button class="btn btn-sm btn-danger" id="resetLetterBtn">✕ borrar</button>
        <button class="btn btn-sm btn-warning" id="clearMessageBtn">🗑️ limpiar</button>
        <span class="status-badge" id="manualStatus">construyendo</span>
      </div>
    </div>

    <div class="flex-wrap">
      <div class="audio-controls">
        <button class="btn btn-success btn-sm" id="playBtn">▶ escuchar</button>
        <button class="btn btn-warning btn-sm" id="stopBtn">⏹ stop</button>
        <button class="btn btn-sm" id="saveBtn">💾 guardar</button>
        <button class="btn btn-outline btn-sm" id="receiveBtn">📂 recibir audio</button>
        <input type="file" id="fileInput" accept="audio/*">
      </div>

      <span class="status-badge" id="statusBadge">listo</span>
      <span class="security-badge">🔒 seguro</span>
    </div>

    <div class="receiver-panel">
      <div class="receiver-toolbar">
        <button class="btn btn-success btn-sm" id="micBtn">🎙️ micrófono</button>
        <button class="btn btn-warning btn-sm" id="liveStopBtn" disabled>⏹ detener RX</button>
        <button class="btn btn-outline btn-sm" id="clearRxBtn">🧹 limpiar RX</button>
        <button class="btn btn-outline btn-sm" id="selfTestBtn">🧪 probar TE AMO</button>
        <span class="status-badge" id="rxModeBadge"><span class="live-dot" id="liveDot"></span>esperando</span>
      </div>

      <canvas id="waveformCanvas" width="900" height="125"></canvas>

      <div class="signal-row">
        <div class="signal-meter"><div class="signal-meter-fill" id="signalMeterFill"></div></div>
        <div class="signal-text" id="signalText">señal 0%</div>
      </div>

      <div class="decoder-grid">
